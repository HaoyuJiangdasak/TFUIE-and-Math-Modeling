<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><style>
@page{margin:0}
html,body{margin:0;padding:0;width:fit-content;height:fit-content;background:transparent}
.fig,.fig *{font-family:"Times New Roman","SimSun","Songti SC","Microsoft YaHei",serif;
  -webkit-font-smoothing:antialiased;box-sizing:border-box;font-style:normal!important}
.fig{width:640px;height:656px;background:transparent;padding:16px;display:flex;
  flex-direction:column;break-inside:avoid;page-break-inside:avoid}
.rw{display:flex;align-items:stretch}
.lg{width:100px;flex:0 0 100px;display:flex;flex-direction:column;align-items:stretch}
.rg{width:84px;flex:0 0 84px;display:flex;flex-direction:column;align-items:stretch}
.nd{width:424px;flex:0 0 424px;display:flex;align-items:center;justify-content:center}
.bx{width:100%;border:1.2px solid #000;background:#fff;color:#000;text-align:center;
  font-size:14px;line-height:1.5;padding:7px 10px}
.tm{border-radius:19px;width:150px}
.io{transform:skewX(-11deg);width:410px}
.io>span{display:block;transform:skewX(11deg)}
.pd{border-left:3.6px double #000;border-right:3.6px double #000}
.dc{flex:0 0 360px;width:360px;height:72px;background:#000;display:flex;align-items:center;
  justify-content:center;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.dc>span{display:flex;align-items:center;justify-content:center;width:100%;height:100%;
  background:#fff;color:#000;font-size:14px;line-height:1.4;text-align:center;
  clip-path:polygon(50% 1.63px,calc(100% - 8.16px) 50%,50% calc(100% - 1.63px),8.16px 50%)}
.sb{flex:0 0 32px;height:1.6px;background:#000}
.sb.iv{background:transparent}
.aw{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.aw .ac{grid-column:2;display:flex;flex-direction:column;align-items:center}
.aw .ac .ln{width:1.6px;height:13px;background:#000}
.aw .ac .tp{width:0;height:0;border-top:6px solid #000;border-left:5px solid transparent;
  border-right:5px solid transparent}
.aw .yl{grid-column:3;justify-self:start;font-size:14px;color:#000;padding-left:6px}
.gv{flex:1;min-height:2px;width:1.6px;background:#000}
.lg .gv{margin-right:auto}
.rg .gv{margin-left:auto}
.hs{display:flex;align-items:center;flex:0 0 auto}
.lg .hs{flex-direction:row-reverse}
.hs .hz{flex:1;height:1.6px;background:#000}
.hs .cvu,.hs .cvd{flex:0 0 1.6px;width:1.6px;height:calc(50% + 0.8px);background:#000}
.hs .cvu{align-self:flex-start}
.hs .cvd{align-self:flex-end}
.hs .s8{flex:0 0 8px;height:1.6px;background:#000}
.lg .hs .hd{width:0;height:0;border-left:7px solid #000;border-top:4.5px solid transparent;
  border-bottom:4.5px solid transparent}
.rg .hs .hd{width:0;height:0;border-right:7px solid #000;border-top:4.5px solid transparent;
  border-bottom:4.5px solid transparent}
.lb{background:#fff;color:#000;font-size:14px;line-height:1.35;text-align:center;
  padding:1px 2px;white-space:nowrap;flex:0 0 auto}
.lb.tt{line-height:1.2;padding:0 3px}
.sp{flex:1;min-height:2px}
</style></head><body>
<div class="fig" data-mh-palette="mono" data-mh-flow="iso5807">
  <div class="rw">
    <div class="lg"></div>
    <div class="nd"><div class="bx tm" data-mh-node="true" data-mh-role="terminator">开始</div></div>
    <div class="rg"></div>
  </div>
  <div class="rw">
    <div class="lg"></div>
    <div class="nd"><div class="aw"><span class="ac"><span class="ln"></span><span class="tp"></span></span></div></div>
    <div class="rg"></div>
  </div>

  <div class="rw">
    <div class="lg"></div>
    <div class="nd"><div class="bx io" data-mh-node="true" data-mh-role="input"><span>读入热风温度与湿度时程及圆柱几何尺寸</span></div></div>
    <div class="rg"></div>
  </div>
  <div class="rw">
    <div class="lg"></div>
    <div class="nd"><div class="aw"><span class="ac"><span class="ln"></span><span class="tp"></span></span></div></div>
    <div class="rg"></div>
  </div>

  <div class="rw">
    <div class="lg"></div>
    <div class="nd"><div class="bx" data-mh-node="true" data-mh-role="process">取常物性参数并设定均匀初始温度</div></div>
    <div class="rg"></div>
  </div>
  <div class="rw">
    <div class="lg"></div>
    <div class="nd"><div class="aw"><span class="ac"><span class="ln"></span><span class="tp"></span></span></div></div>
    <div class="rg"></div>
  </div>

  <div class="rw">
    <div class="lg">
      <div class="sp"></div>
      <div class="hs"><span class="hd"></span><span class="hz"></span><span class="lb tt">加密网格<br>减小步长</span><span class="hz"></span><span class="cvd"></span></div>
      <div class="gv"></div>
    </div>
    <div class="nd"><div class="bx" data-mh-node="true" data-mh-role="process">半径方向守恒有限体积离散并反解表面温度</div></div>
    <div class="rg"></div>
  </div>
  <div class="rw">
    <div class="lg"><div class="gv"></div></div>
    <div class="nd"><div class="aw"><span class="ac"><span class="ln"></span><span class="tp"></span></span></div></div>
    <div class="rg"></div>
  </div>

  <div class="rw">
    <div class="lg"><div class="gv"></div></div>
    <div class="nd"><div class="bx" data-mh-node="true" data-mh-role="process">隐式推进一个时间步更新径向温度分布</div></div>
    <div class="rg">
      <div class="sp"></div>
      <div class="hs"><span class="hd"></span><span class="hz"></span><span class="cvd"></span></div>
      <div class="gv"></div>
    </div>
  </div>
  <div class="rw">
    <div class="lg"><div class="gv"></div></div>
    <div class="nd"><div class="aw"><span class="ac"><span class="ln"></span><span class="tp"></span></span></div></div>
    <div class="rg"><div class="gv"></div></div>
  </div>
  <div class="rw">
    <div class="lg"><div class="gv"></div></div>
    <div class="nd"><span class="sb iv"></span><div class="dc" data-mh-node="true" data-mh-role="decision"><span>中心温度是否接近热风平衡温度</span></div><span class="sb"></span></div>
    <div class="rg">
      <div class="gv"></div>
      <div class="hs"><span class="s8"></span><span class="lb">否</span><span class="hz"></span><span class="cvu"></span></div>
      <div class="sp"></div>
    </div>
  </div>
  <div class="rw">
    <div class="lg"><div class="gv"></div></div>
    <div class="nd"><div class="aw"><span class="ac"><span class="ln"></span><span class="tp"></span></span><span class="yl">是</span></div></div>
    <div class="rg"></div>
  </div>

  <div class="rw">
    <div class="lg"><div class="gv"></div></div>
    <div class="nd"><div class="bx pd" data-mh-node="true" data-mh-role="predefined">调用半解析级数解逐点对照</div></div>
    <div class="rg"></div>
  </div>
  <div class="rw">
    <div class="lg"><div class="gv"></div></div>
    <div class="nd"><div class="aw"><span class="ac"><span class="ln"></span><span class="tp"></span></span></div></div>
    <div class="rg"></div>
  </div>

  <div class="rw">
    <div class="lg">
      <div class="gv"></div>
      <div class="hs"><span class="s8"></span><span class="lb">否</span><span class="hz"></span><span class="cvu"></span></div>
      <div class="sp"></div>
    </div>
    <div class="nd"><span class="sb"></span><div class="dc" data-mh-node="true" data-mh-role="decision"><span>逐点偏差是否满足精度要求</span></div><span class="sb iv"></span></div>
    <div class="rg"></div>
  </div>
  <div class="rw">
    <div class="lg"></div>
    <div class="nd"><div class="aw"><span class="ac"><span class="ln"></span><span class="tp"></span></span><span class="yl">是</span></div></div>
    <div class="rg"></div>
  </div>

  <div class="rw">
    <div class="lg"></div>
    <div class="nd"><div class="bx io" data-mh-node="true" data-mh-role="output"><span>输出预热段径向温度分布与达平衡时间</span></div></div>
    <div class="rg"></div>
  </div>
  <div class="rw">
    <div class="lg"></div>
    <div class="nd"><div class="aw"><span class="ac"><span class="ln"></span><span class="tp"></span></span></div></div>
    <div class="rg"></div>
  </div>

  <div class="rw">
    <div class="lg"></div>
    <div class="nd"><div class="bx tm" data-mh-node="true" data-mh-role="terminator">结束</div></div>
    <div class="rg"></div>
  </div>
</div>
</body></html>
